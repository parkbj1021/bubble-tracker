name: Update Bubble Data

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 9 am US Eastern (EDT = UTC-4), weekdays
  workflow_dispatch:           # manual trigger button in GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance feedparser requests

      - name: Fetch live data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
